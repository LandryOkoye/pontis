[package]
name = "pontis-core"
version = "0.1.0"
description = "Pontis core protocol contract: roles, registry, compatibility, policy, conversion and vault (testnet, synthetic assets only)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
