name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: scripts/rust-ci.sh fmt
      - run: scripts/rust-ci.sh clippy
      - run: scripts/rust-ci.sh test

  contracts-integration:
    name: Contracts (sandbox integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-near
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh \
            || cargo install cargo-near --locked
      - run: scripts/integration-tests.sh

  node:
    name: Node (lint, typecheck, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pontis
          POSTGRES_PASSWORD: pontis
          POSTGRES_DB: pontis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pontis -d pontis"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://pontis:pontis@localhost:5432/pontis
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test

  e2e:
    name: System E2E (sandbox chain, Postgres, API, indexer)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The run deploys the contracts to a local NEAR sandbox it starts itself, so it never touches a
    # public Testnet RPC. It creates and drops its own database in the Postgres service below.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pontis
          POSTGRES_PASSWORD: pontis
          POSTGRES_DB: pontis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pontis -d pontis"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://pontis:pontis@localhost:5432/pontis
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install wasm-opt (binaryen), pinned
        run: npm install --global binaryen@132.0.0
      - name: Build the contracts (slim wasm, as the e2e README describes)
        run: scripts/build-contracts.sh slim
      - name: Run the end-to-end scenario
        run: pnpm --filter @pontis/e2e e2e
      - name: Keep the API, indexer and sandbox logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: /tmp/pontis-e2e-*
          if-no-files-found: ignore
          retention-days: 7
