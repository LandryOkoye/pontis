        - ACCEPTED
        - SUBMITTED
        - SETTLED
        - EXPIRED
        - REJECTED
        - CANCELLED
        - FAILED
        - REQUIRES_RECONCILIATION
    CreateQuoteRequest:
      type: object
      properties:
        fromId:
          type: string
        toId:
          type: string
        amountIn:
          $ref: "#/components/schemas/AmountString"
        accountId:
          $ref: "#/components/schemas/AccountId"
      required:
        - fromId
        - toId
        - amountIn
        - accountId
      additionalProperties: false
    CreateConversionResponse:
      type: object
      properties:
        conversionId:
          $ref: "#/components/schemas/Uuid"
        quoteId:
          $ref: "#/components/schemas/Uuid"
        actions:
          type: array
          items:
            $ref: "#/components/schemas/WalletAction"
          minItems: 1
      required:
        - conversionId
        - quoteId
        - actions
    WalletAction:
      type: object
      properties:
        receiverId:
          $ref: "#/components/schemas/AccountId"
        methodName:
          type: string
        args:
          type: object
          additionalProperties: {}
        gas:
          type: string
          pattern: ^[0-9]+$
        deposit:
          type: string
          pattern: ^[0-9]+$
      required:
        - receiverId
        - methodName
        - args
        - gas
        - deposit
    CreateConversionRequest:
      type: object
      properties:
        quoteId:
          $ref: "#/components/schemas/Uuid"
      required:
        - quoteId
      additionalProperties: false
    Transaction:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        quote:
          $ref: "#/components/schemas/Quote"
        state:
          $ref: "#/components/schemas/QuoteState"
        txHash:
          $ref: "#/components/schemas/TxHash"
        reportedTxHash:
          $ref: "#/components/schemas/TxHash"
        txHashStatus:
          $ref: "#/components/schemas/TxHashStatus"
        failureReason:
          type:
            - string
            - "null"
        events:
          type: array
          items:
            $ref: "#/components/schemas/SettlementEvent"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        submittedAt:
          $ref: "#/components/schemas/Timestamp"
        settledAt:
          $ref: "#/components/schemas/Timestamp"
      required:
        - id
        - quote
        - state
        - txHash
        - reportedTxHash
        - txHashStatus
        - failureReason
        - events
        - createdAt
        - submittedAt
        - settledAt
    TxHash:
      type:
        - string
        - "null"
      minLength: 32
      maxLength: 64
      description: NEAR transaction hash (base58).
      example: 9ZkBqE3nVhJ2pJt8h4Y8yH5m3xKcM6W7kQ1sF2dRnA4T
    TxHashStatus:
      type: string
      enum:
        - NONE
        - REPORTED
        - VERIFIED
        - REJECTED
      description: "NONE: no hash reported. REPORTED: sent by the wallet, not confirmed on chain. VERIFIED: the chain shows it is this conversion's transaction. REJECTED: the chain shows it is not."
    SettlementEvent:
      type: object
      properties:
        eventName:
          type: string
        receiptId:
          type: string
        logIndex:
          type: integer
          minimum: 0
        blockHeight:
          type: integer
          minimum: 0
        blockTimestamp:
          $ref: "#/components/schemas/Timestamp"
        txHash:
          $ref: "#/components/schemas/TxHash"
        data: {}
      required:
        - eventName
        - receiptId
        - logIndex
        - blockHeight
        - blockTimestamp
        - txHash
    SubmittedRequest:
      type: object
      properties:
        txHash:
          $ref: "#/components/schemas/TxHash"
      required:
        - txHash
      additionalProperties: false
    TransactionList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
      required:
        - items
    ReconciliationReport:
      type: object
      properties:
        status:
          type: string
          enum:
            - OK
            - ATTENTION
            - NEVER_RUN
        ranAt:
          $ref: "#/components/schemas/Timestamp"
        findings:
          type: array
          items:
            $ref: "#/components/schemas/ReconciliationFinding"
        vaults:
          type: array
          items:
            $ref: "#/components/schemas/VaultReading"
        requiresReconciliation:
          type: array
          items:
            $ref: "#/components/schemas/FlaggedQuote"
      required:
        - status
        - ranAt
        - findings
        - vaults
        - requiresReconciliation
    ReconciliationFinding:
      type: object
      properties:
        key:
          type: string
        kind:
          $ref: "#/components/schemas/ReconciliationKind"
        severity:
          $ref: "#/components/schemas/FindingSeverity"
        subject:
          type: string
        message:
          type: string
        firstSeenAt:
          $ref: "#/components/schemas/Timestamp"
      required:
        - key
        - kind
        - severity
        - subject
        - message
        - firstSeenAt
    ReconciliationKind:
      type: string
      enum:
        - STUCK_SUBMITTED
        - SETTLED_WITHOUT_EVENT
        - COMPLETION_NOT_SETTLED
        - SETTLEMENT_MISMATCH
        - VAULT_INSOLVENT
        - VAULT_UNTRACKED_BALANCE
    FindingSeverity:
      type: string
      enum:
        - critical
        - warning
    VaultReading:
      type: object
      properties:
        representationId:
          type: string
        tokenAccountId:
          $ref: "#/components/schemas/AccountId"
        inventory:
          $ref: "#/components/schemas/AmountString"
        balance:
          $ref: "#/components/schemas/AmountString"
      required:
        - representationId
        - tokenAccountId
        - inventory
        - balance
    FlaggedQuote:
      type: object
      properties:
        quoteId:
          $ref: "#/components/schemas/Uuid"
        conversionId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
            - type:
                - string
                - "null"
        reason:
          type:
            - string
            - "null"
        flaggedAt:
          $ref: "#/components/schemas/Timestamp"
      required:
        - quoteId
        - conversionId
        - reason
        - flaggedAt
  parameters: {}
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Combined service health
      description: Always 200 while the process can answer; the body carries the verdict. `status` is `ok` only when the database and RPC answer and the indexer state is `running`; otherwise `degraded`. Use `/v1/health/ready` for a probe that fails on non-readiness.
      tags:
        - Health
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "429":
          description: "Rate limited. Codes: RATE_LIMITED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: "Internal error. Codes: INTERNAL."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/health/live:
    get:
      operationId: getHealthLive
      summary: Liveness
      description: Answers 200 whenever the process is up. Touches no database, RPC or indexer state, so it is safe for restart probes.
      tags:
        - Health
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
        "429":
          description: "Rate limited. Codes: RATE_LIMITED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: "Internal error. Codes: INTERNAL."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/health/ready:
    get:
      operationId: getHealthReady
      summary: Readiness
      description: 200 when the database and RPC answer and the indexer is `running` or `lagging`; 503 otherwise. A lagging indexer is still ready, but `status` in the body is `degraded`.
      tags:
        - Health
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "429":
          description: "Rate limited. Codes: RATE_LIMITED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: "Internal error. Codes: INTERNAL."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: "Not ready: the database or RPC is unreachable, or the indexer never ran or is stale. Same body as `/v1/health`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/issuers:
    get:
      operationId: listIssuers
      summary: List issuers
      tags:
        - Registry
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuerList"
        "429":
          description: "Rate limited. Codes: RATE_LIMITED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: "Internal error. Codes: INTERNAL."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/issuers/{id}:
    get:
      operationId: getIssuer
      summary: Issuer detail with evidence
      tags:
        - Registry
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issuer"
        "404":
          description: "Not found. Codes: NOT_FOUND."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: "Rate limited. Codes: RATE_LIMITED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: "Internal error. Codes: INTERNAL."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/assets:
    get:
      operationId: listAssets
      summary: "Asset directory: search, filter, sort, paginate"
      description: One row per representation with its canonical claim name, issuer summary, filter facts, latest market figures and a 7 day sparkline. `market` is null when the asset has no price. Every market figure carries `simulated` and `sources`; `data` selects real rows, simulated rows, or real where they exist (`all`). Sorting by a figure that is null for some assets puts those last. Cursors are opaque and valid only for the same query.
      tags:
        - Market
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 100
          required: false
          name: q
          in: query
        - schema:
            type: string
            maxLength: 100
          required: false
          name: category
          in: query
        - schema:
            type: string
            maxLength: 64
          required: false
          name: issuerId
          in: query
        - schema:
            type: string
            maxLength: 64
          required: false
          name: chain
          in: query
        - schema:
            type: string
            enum:
              - unverified
              - issuer_attested
              - third_party_attested
              - independently_verified
          required: false
          name: verification
          in: query
        - schema:
            $ref: "#/components/schemas/RecordStatus"
          required: false
          name: status
          in: query
        - schema:
            type: string
            enum:
              - "true"
              - "false"
          required: false
          name: convertible
          in: query
        - schema:
            type: string
            enum:
              - "true"
              - "false"
          required: false
          name: bridgeable
          in: query
        - schema:
            type: string
            enum:
              - id
              - name
              - price
              - marketCap
              - tvl
              - volume24h
              - change24h
              - change7d
              - change30d
            default: id
          required: false
          name: sort
          in: query
        - schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
          required: false
          name: order
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          required: false
          name: limit
          in: query
        - schema:
            type: string
            maxLength: 200
          required: false
          name: cursor
          in: query
        - schema:
            $ref: "#/components/schemas/DataFilter"
          required: false
          description: "`real` or `simulated` select one class. `all` uses a real row where one exists and a simulated one otherwise; every row still carries its own `simulated` flag."
          name: data
          in: query
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetList"
        "400":
          description: "Invalid request. Codes: VALIDATION_ERROR."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: "Rate limited. Codes: RATE_LIMITED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: "Internal error. Codes: INTERNAL."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/assets/{id}/charts/price:
