            state:
              type: string
              enum:
                - never_run
                - running
                - lagging
                - stale
              description: "`never_run`: no cursor row. `stale`: the last heartbeat is older than the API's INDEXER_STALE_AFTER_MS (stopped or crashed; the two cannot be told apart). `lagging`: heartbeat fresh but more than INDEXER_MAX_LAG_BLOCKS behind the chain. `running`: heartbeat fresh and within the lag limit."
