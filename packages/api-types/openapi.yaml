          items:
            $ref: "#/components/schemas/VaultReading"
        requiresReconciliation:
          type: array
          items:
            $ref: "#/components/schemas/FlaggedQuote"
      required:
        - status
        - ranAt
        - findings
        - vaults
        - requiresReconciliation
    ReconciliationFinding:
      type: object
      properties:
        key:
          type: string
        kind:
          $ref: "#/components/schemas/ReconciliationKind"
        severity:
          $ref: "#/components/schemas/FindingSeverity"
        subject:
          type: string
        message:
          type: string
        firstSeenAt:
          $ref: "#/components/schemas/Timestamp"
      required:
        - key
        - kind
        - severity
        - subject
        - message
        - firstSeenAt
    ReconciliationKind:
      type: string
      enum:
        - STUCK_SUBMITTED
        - SETTLED_WITHOUT_EVENT
        - COMPLETION_NOT_SETTLED
        - SETTLEMENT_MISMATCH
        - VAULT_INSOLVENT
        - VAULT_UNTRACKED_BALANCE
    FindingSeverity:
      type: string
      enum:
        - critical
        - warning
    VaultReading:
      type: object
      properties:
        representationId:
          type: string
        tokenAccountId:
          $ref: "#/components/schemas/AccountId"
        inventory:
          $ref: "#/components/schemas/AmountString"
        balance:
          $ref: "#/components/schemas/AmountString"
      required:
        - representationId
        - tokenAccountId
        - inventory
        - balance
    FlaggedQuote:
      type: object
      properties:
        quoteId:
          $ref: "#/components/schemas/Uuid"
        conversionId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
            - type:
                - string
                - "null"
        reason:
          type:
            - string
            - "null"
        flaggedAt:
          $ref: "#/components/schemas/Timestamp"
      required:
        - quoteId
        - conversionId
        - reason
        - flaggedAt
  parameters: {}
