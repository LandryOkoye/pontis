  /v1/assets:
    get:
      operationId: listAssets
      summary: "Asset directory: search, filter, sort, paginate"
      description: One row per representation with its canonical claim name, issuer summary, filter facts, latest market figures and a 7 day sparkline. `market` is null when the asset has no price. Every market figure carries `simulated` and `sources`; `data` selects real rows, simulated rows, or real where they exist (`all`). Sorting by a figure that is null for some assets puts those last. Cursors are opaque and valid only for the same query.
      tags:
        - Market
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 100
          required: false
          name: q
          in: query
        - schema:
            type: string
            maxLength: 100
          required: false
          name: category
          in: query
        - schema:
            type: string
            maxLength: 64
          required: false
          name: issuerId
          in: query
        - schema:
            type: string
            maxLength: 64
          required: false
          name: chain
          in: query
        - schema:
            type: string
            enum:
              - unverified
              - issuer_attested
              - third_party_attested
              - independently_verified
          required: false
          name: verification
          in: query
        - schema:
            $ref: "#/components/schemas/RecordStatus"
          required: false
          name: status
          in: query
        - schema:
            type: string
            enum:
              - "true"
              - "false"
          required: false
          name: convertible
          in: query
        - schema:
            type: string
            enum:
              - "true"
              - "false"
          required: false
          name: bridgeable
          in: query
        - schema:
            type: string
            enum:
              - id
              - name
              - price
              - marketCap
              - tvl
              - volume24h
              - change24h
              - change7d
              - change30d
            default: id
          required: false
          name: sort
          in: query
        - schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
          required: false
          name: order
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          required: false
          name: limit
          in: query
        - schema:
            type: string
            maxLength: 200
          required: false
          name: cursor
          in: query
        - schema:
            $ref: "#/components/schemas/DataFilter"
          required: false
          description: "`real` or `simulated` select one class. `all` uses a real row where one exists and a simulated one otherwise; every row still carries its own `simulated` flag."
          name: data
          in: query
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetList"
        "400":
          description: "Invalid request. Codes: VALIDATION_ERROR."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: "Rate limited. Codes: RATE_LIMITED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: "Internal error. Codes: INTERNAL."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
