    ProtocolMetrics:
      type: object
      properties:
        asOf:
          $ref: "#/components/schemas/Timestamp"
        windows:
          type: array
          items:
            $ref: "#/components/schemas/MetricWindow"
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/Metric"
      required:
        - asOf
        - windows
        - metrics
    MetricWindow:
      type: string
      enum:
        - 24h
        - 7d
        - all
      description: Rolling window ending at `asOf`; `all` has no lower bound.
    Metric:
      type: object
      properties:
        key:
          type: string
        unit:
          $ref: "#/components/schemas/MetricUnit"
        scope:
          type: string
          enum:
            - window
            - now
        available:
          type: boolean
        availableFrom:
          type: string
        simulated:
          type: boolean
        note:
          type: string
        values:
          $ref: "#/components/schemas/WindowedValues"
        value:
          $ref: "#/components/schemas/MetricValue"
      required:
        - key
        - unit
        - scope
        - available
    MetricUnit:
      type: string
      enum:
        - count
        - ratio
        - percent
        - seconds
        - blocks
        - base_units
        - usd
        - bps
      description: "`ratio` is a share from 0 to 1 and `percent` a share from 0 to 100, both with 6 decimals; `seconds` has 3 decimals."
    WindowedValues:
      type: object
      properties:
        24h:
          $ref: "#/components/schemas/MetricValue"
        7d:
          $ref: "#/components/schemas/MetricValue"
        all:
          $ref: "#/components/schemas/MetricValue"
      required:
        - 24h
        - 7d
        - all
    MetricValue:
      anyOf:
        - type: integer
          minimum: 0
        - type: string
          pattern: ^[0-9]+\.[0-9]+$
        - type: "null"
      description: An integer count, or a decimal string for rates and latencies; null when it cannot be computed (no data in the window, or an unreachable chain head).
    AdminMetrics:
      type: object
      properties:
        asOf:
          $ref: "#/components/schemas/Timestamp"
        windows:
          type: array
          items:
            $ref: "#/components/schemas/MetricWindow"
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/Metric"
        breakdowns:
          type: array
          items:
            $ref: "#/components/schemas/MetricBreakdown"
        requiresReconciliationQuoteIds:
          type: array
          items:
            $ref: "#/components/schemas/Uuid"
      required:
        - asOf
        - windows
        - metrics
        - breakdowns
        - requiresReconciliationQuoteIds
    MetricBreakdown:
      type: object
      properties:
        key:
          type: string
        unit:
          type: string
          enum:
            - base_units
        scope:
          type: string
          enum:
            - window
            - now
        simulated:
          type: boolean
        note:
          type: string
        values:
          type: object
          properties:
            24h:
              $ref: "#/components/schemas/RepresentationAmounts"
            7d:
              $ref: "#/components/schemas/RepresentationAmounts"
            all:
              $ref: "#/components/schemas/RepresentationAmounts"
          required:
            - 24h
            - 7d
            - all
        value:
          $ref: "#/components/schemas/RepresentationAmounts"
      required:
        - key
        - unit
        - scope
        - simulated
    RepresentationAmounts:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/AmountString"
    PrometheusText:
      type: string
      description: "Prometheus text exposition format 0.0.4: `# HELP` and `# TYPE` lines, then samples named `pontis_<key>` with labels `window`, `representation` and `simulated`."
  parameters: {}
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Combined service health
      description: Always 200 while the process can answer; the body carries the verdict. `status` is `ok` only when the database and RPC answer and the indexer state is `running`; otherwise `degraded`. Use `/v1/health/ready` for a probe that fails on non-readiness.
      tags:
        - Health
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "429":
          description: "Rate limited. Codes: RATE_LIMITED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: "Internal error. Codes: INTERNAL."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/health/live:
    get:
      operationId: getHealthLive
      summary: Liveness
      description: Answers 200 whenever the process is up. Touches no database, RPC or indexer state, so it is safe for restart probes.
      tags:
        - Health
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
        "429":
          description: "Rate limited. Codes: RATE_LIMITED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: "Internal error. Codes: INTERNAL."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/health/ready:
    get:
      operationId: getHealthReady
      summary: Readiness
      description: 200 when the database and RPC answer and the indexer is `running` or `lagging`; 503 otherwise. A lagging indexer is still ready, but `status` in the body is `degraded`.
      tags:
        - Health
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "429":
          description: "Rate limited. Codes: RATE_LIMITED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: "Internal error. Codes: INTERNAL."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: "Not ready: the database or RPC is unreachable, or the indexer never ran or is stale. Same body as `/v1/health`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/issuers:
    get:
      operationId: listIssuers
      summary: List issuers
      tags:
