  /v1/reserves/attestations:
    post:
      operationId: submitReserveAttestation
      summary: Relay a signed reserve attestation
      description: "Testnet and sandbox only. A relayer account pays for the transaction; the signature is the authority, so the relayer holds no custodian key and no user key. The contract checks the signature, the custodian's registered key, the link, the time and the sequence, and refuses with `ATTESTATION_REJECTED` otherwise. Unknown asset: `NOT_FOUND`; also `NOT_FOUND` where no relayer is configured."
      tags:
        - Custody
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitReserveAttestationRequest"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitReserveAttestationResponse"
        "400":
          description: "Invalid request. Codes: VALIDATION_ERROR."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: "Not found. Codes: NOT_FOUND."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: "Request understood but refused. Codes: ATTESTATION_REJECTED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: "Rate limited. Codes: RATE_LIMITED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: "Internal error. Codes: INTERNAL."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/quotes:
    post:
      operationId: createQuote
      summary: Request a parity-conversion quote
      description: Refusals are `422` with a structured error whose `code` is the reason. Quotes expire after 60 seconds, or at the start of the next approved corporate-action freeze window of either claim if that comes sooner.
      tags:
        - Quotes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuoteRequest"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          description: "Invalid request. Codes: VALIDATION_ERROR."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: "Not found. Codes: NOT_FOUND."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: "Request understood but refused. Codes: NOT_DIRECT_EQUIVALENT, RELATIONSHIP_SUSPENDED, ASSET_PAUSED, NOT_ELIGIBLE, INSUFFICIENT_INVENTORY, PRICE_DEVIATION, PRICE_STALE, PRICE_UNAVAILABLE, AMOUNT_BELOW_MIN, AMOUNT_ABOVE_MAX, WINDOW_LIMIT_EXCEEDED, CORPORATE_ACTION_FREEZE, CORPORATE_ACTION_PENDING, EPOCH_MISMATCH, NOT_CONVERTIBLE, LIFECYCLE_BLOCKED, NAV_WINDOW_CLOSED, RESERVE_RESTRICTED, RESERVE_STALE."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: "Rate limited. Codes: RATE_LIMITED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: "Internal error. Codes: INTERNAL."
          content:
