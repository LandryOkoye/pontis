          description: "Not found. Codes: NOT_FOUND."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "Conflict. Codes: QUOTE_ALREADY_USED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "410":
          description: "Gone. Codes: QUOTE_EXPIRED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: "Request understood but refused. Codes: VALIDATION_ERROR."
          content:
